[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-bank-assistant"
version = "0.1.0"
description = "Asistente RAG sobre el sitio web público de un banco (bbva.com.co)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.4,<3",
    "protego>=0.3,<1",
    "requests>=2.32,<3",
    "trafilatura>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "responses>=0.25",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
