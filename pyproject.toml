[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-bank-assistant"
version = "0.1.0"
description = "Asistente RAG sobre el sitio web público de un banco (bbva.com.co)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.4,<3",
    "qdrant-client>=1.12,<2",
    "fastapi>=0.115,<1",
    "fastembed>=0.7,<1",
    "protego>=0.3,<1",
    "requests>=2.32,<3",
    "streamlit>=1.39,<2",
    "trafilatura>=2.0,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-cov>=5",
    "responses>=0.25",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
